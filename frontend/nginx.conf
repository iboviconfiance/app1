server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Taille max des requêtes HTTP entrantes (pour les uploads vidéo 150 Mo)
    client_max_body_size 160M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/octet-stream;

    # ── Upload de fichiers → backend (timeouts longs pour vidéos 150 Mo) ──────
    # Piège 2 corrigé : proxy_read/send/connect timeout 300s au lieu de 60s
    location /api/admin/upload {
        proxy_pass http://backend:3000/api/admin/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        # Désactiver le buffering pour les gros uploads
        proxy_request_buffering off;
    }

    # ── API REST → backend ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Fichiers uploadés servis DIRECTEMENT par Nginx ────────────────────────
    # Volume Docker backend_uploads monté en lecture seule sur /app/uploads
    # Nginx gère nativement les requêtes 206 Partial Content (Range Requests)
    # → lecture vidéo progressive en Flutter sans tout télécharger
    location /uploads/ {
        alias /app/uploads/;

        # Support des Range Requests pour la lecture vidéo progressive
        add_header Accept-Ranges bytes;

        # Headers CORS pour autoriser le lecteur Flutter Web
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

        # Cache long pour les fichiers statiques (PDF, vidéos)
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        # Sécurité : interdit le listing du dossier
        autoindex off;
    }

    # ── Application Flutter Web (SPA) ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache assets statiques ────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
